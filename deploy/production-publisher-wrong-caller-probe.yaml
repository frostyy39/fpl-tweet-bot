# Temporary authenticated wrong-caller denial proof under the Windows worker identity.
apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: captain-production-wrong-caller-probe
  namespace: fpl-frosty-bot-v1
spec:
  template:
    spec:
      taskCount: 1
      parallelism: 1
      template:
        spec:
          serviceAccountName: captain-worker@fpl-frosty-bot-v1.iam.gserviceaccount.com
          maxRetries: 0
          timeoutSeconds: '120'
          containers:
            - image: europe-west2-docker.pkg.dev/fpl-frosty-bot-v1/captain-images/production-publisher@sha256:5c12b1bd4c4786fdea68f5c42453d314cd217c6ac3de923e80891117e6c17e84
              command: [python]
              args:
                - '-c'
                - |
                  import json
                  from urllib.error import HTTPError
                  from urllib.request import HTTPRedirectHandler, Request, build_opener, urlopen
                  origin = 'https://captain-production-publisher-524790767721.europe-west1.run.app'
                  metadata = Request('http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/identity?audience=' + origin + '&format=full', headers={'Metadata-Flavor': 'Google'})
                  with urlopen(metadata, timeout=10) as response:
                      token = response.read().decode()
                  payload = json.dumps({'version': 1, 'generation_id': '11111111-1111-4111-8111-111111111111', 'attempt_id': '22222222-2222-4222-8222-222222222222', 'handoff_digest': 'a' * 64, 'candidate_digest': 'b' * 64, 'claim_id': '33333333-3333-4333-8333-333333333333'}).encode()
                  class NoRedirect(HTTPRedirectHandler):
                      def redirect_request(self, request, file_pointer, code, message, headers, new_url):
                          return None
                  request = Request(origin + '/captain/publisher/execute', data=payload, headers={'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'}, method='POST')
                  del token
                  try:
                      build_opener(NoRedirect).open(request, timeout=15)
                  except HTTPError as error:
                      assert error.code == 403
                  else:
                      raise RuntimeError('worker identity unexpectedly invoked production publisher')
                  print(json.dumps({'worker_identity': 'denied'}, sort_keys=True))
