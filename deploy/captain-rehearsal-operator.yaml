apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: captain-rehearsal-operator
spec:
  template:
    spec:
      taskCount: 1
      parallelism: 1
      template:
        spec:
          serviceAccountName: captain-planner@fpl-frosty-bot-v1.iam.gserviceaccount.com
          maxRetries: 0
          timeoutSeconds: '90'
          containers:
            - image: europe-west2-docker.pkg.dev/fpl-frosty-bot-v1/captain-images/controller:b63809fdb5669fa90459689a4e2a42444acfa2db
              resources:
                limits:
                  cpu: '1'
                  memory: 512Mi
              env:
                - name: CAPTAIN_OPERATOR_ACTION
                  value: inspect
                - name: CAPTAIN_CONTROLLER_ORIGIN
                  value: https://captain-controller-524790767721.europe-west1.run.app
                - name: CAPTAIN_REHEARSAL_ID
                  value: ''
                - name: CAPTAIN_REHEARSAL_RELEASE_UTC
                  value: ''
              command: [python]
              args:
                - '-c'
                - |
                  import dataclasses
                  import json
                  import os
                  from datetime import date, datetime
                  from decimal import Decimal
                  from enum import Enum
                  from urllib.error import HTTPError
                  from urllib.request import Request, build_opener
                  from uuid import UUID

                  from fpl_bot.captain_serialization import from_document
                  from fpl_bot.captain_transport import (
                      MetadataIdentityTokenSource,
                      MetadataTokenConfig,
                      _NoRedirect,
                  )

                  action = os.environ['CAPTAIN_OPERATOR_ACTION']
                  origin = os.environ['CAPTAIN_CONTROLLER_ORIGIN'].rstrip('/')
                  if action == 'plan':
                      route = '/captain/control/rehearsal'
                      payload = {
                          'schema_version': 1,
                          'rehearsal_id': os.environ['CAPTAIN_REHEARSAL_ID'],
                          'release_utc': os.environ['CAPTAIN_REHEARSAL_RELEASE_UTC'],
                      }
                  elif action == 'inspect':
                      route = '/captain/control/inspect'
                      payload = {}
                  else:
                      raise SystemExit('unsupported operator action')

                  token = MetadataIdentityTokenSource(MetadataTokenConfig(origin)).token()
                  request = Request(
                      origin + route,
                      data=json.dumps(payload, separators=(',', ':')).encode(),
                      method='POST',
                      headers={
                          'Authorization': 'Bearer ' + token,
                          'Content-Type': 'application/json',
                      },
                  )
                  try:
                      with build_opener(_NoRedirect()).open(request, timeout=60) as response:
                          result = json.loads(response.read(1048577))
                  except HTTPError as error:
                      code = error.code
                      error.close()
                      raise SystemExit('Captain operator rejected: HTTP ' + str(code)) from None
                  except Exception:
                      raise SystemExit('Captain operator transport failed') from None
                  finally:
                      token = None

                  if action == 'inspect':
                      for key in (
                          'generation',
                          'rehearsal',
                          'acquisition',
                          'candidate',
                          'posting',
                          'session_health',
                          'vm_lease',
                      ):
                          result[key] = from_document(result.get(key))
                      result['operations'] = [from_document(value) for value in result['operations']]

                  def safe(value):
                      if dataclasses.is_dataclass(value):
                          return {field.name: safe(getattr(value, field.name)) for field in dataclasses.fields(value)}
                      if isinstance(value, dict):
                          return {str(key): safe(item) for key, item in value.items()}
                      if isinstance(value, (list, tuple)):
                          return [safe(item) for item in value]
                      if isinstance(value, (datetime, date)):
                          return value.isoformat()
                      if isinstance(value, (Decimal, UUID)):
                          return str(value)
                      if isinstance(value, Enum):
                          return value.value
                      return value

                  print(json.dumps({'action': action, 'result': safe(result)}, sort_keys=True))
