# Temporary read-only IAM denial probe under the existing FPLBotTest publisher identity.
apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: captain-test-production-denial-probe
  namespace: fpl-frosty-bot-v1
spec:
  template:
    spec:
      taskCount: 1
      parallelism: 1
      template:
        spec:
          serviceAccountName: captain-publisher@fpl-frosty-bot-v1.iam.gserviceaccount.com
          maxRetries: 0
          timeoutSeconds: '120'
          containers:
            - image: europe-west2-docker.pkg.dev/fpl-frosty-bot-v1/captain-images/production-publisher@sha256:5c12b1bd4c4786fdea68f5c42453d314cd217c6ac3de923e80891117e6c17e84
              command: [python]
              args:
                - '-c'
                - |
                  import json
                  from google.api_core.exceptions import PermissionDenied
                  from google.cloud import firestore, secretmanager
                  project = 'fpl-frosty-bot-v1'
                  evidence = {}
                  denied = firestore.Client(project=project, database='production-shared-x-oauth').collection('x_oauth_token_authority').document('x-user-1249335464571650048')
                  try:
                      denied.get()
                  except PermissionDenied:
                      evidence['production_oauth_firestore'] = 'denied'
                  else:
                      raise RuntimeError('production OAuth database unexpectedly readable')
                  try:
                      secretmanager.SecretManagerServiceClient().access_secret_version(request={'name': 'projects/' + project + '/secrets/production-x-oauth-token-state/versions/latest'})
                  except PermissionDenied:
                      evidence['production_token_secret'] = 'denied'
                  else:
                      raise RuntimeError('production token secret unexpectedly readable')
                  print(json.dumps(evidence, sort_keys=True))
