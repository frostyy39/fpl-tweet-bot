[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fpl-tweet-bot"
version = "0.1.0"
description = "Deterministic Fantasy Premier League deadline tweet automation core"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1,<4",
    "google-cloud-firestore>=2.29,<3",
    "google-cloud-secret-manager>=2.25,<3",
    "google-cloud-tasks>=2.24,<3",
    "tzdata>=2025.2; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.11,<1",
]

[project.scripts]
fpl-bot = "fpl_bot.cli:main"
fpl-bot-x-authorize = "fpl_bot.x_oauth_cli:main"
fpl-bot-x-test-post = "fpl_bot.test_post:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
